[project]
name = "feature-extractor"
version = "0.1.0"
description = "Extract features (hidden states, attention, MLP activations) from Hugging Face causal language models with hooks"
authors = [
    { name = "gokamoda", email = "gokamoda@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "torch>=2.7.0",
    "rich>=14.3.3",
    "pytz>=2026.1.post1",
    "tqdm>=4.67.3",
    "multiprocess>=0.70.19",
    "numpy>=2.4.3",
    "transformers>=5.3.0",
    "tokenizer-tools",
    "sentencepiece>=0.2.3",
    "protobuf>=7.36.2",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.8",
    "safetensors>=0.7.0",
]


[dependency-groups]
dev = [
    "ipython>=9.11.0",
    "jupyter>=1.1.1",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
    "ty>=0.0.24",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "gpu" },
  ],
]


[project.optional-dependencies]
# Backend selectors for development in this repository. Consumers declare
# their own torch version and index; the library only requires torch>=2.7.0.
cpu = ["torch==2.7.0"]
gpu = ["torch==2.7.0"]

[tool.uv.sources]
tokenizer-tools = { git = "https://github.com/gokamoda/tokenizer-tools.git", rev = "6ad2efe" }
torch = [
  { index = "pytorch-cpu-mac", extra = "cpu", marker = "platform_system == 'macOS'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "platform_system != 'macOS'" },
  { index = "pytorch-gpu", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu-mac"
url = "https://pypi.python.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["src", "tests"]

[tool.ruff]
exclude = [".git", ".mypy_cache", ".ruff_cache", ".venv", "third_party"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
select = [
    "A",  # flake8-builtin
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warning
    "PL",  # Pylint
    "UP",  # pyupgrade
]
ignore = [
    "B905",  # Zip-without-explicit-strict
    "E501",  # Line too long, handled by black
    "F403",  # Unable to detect undefined names
    "N812",  # Lowercase imported as non-lowercase
    "N816",  # Global scope should not be mixedCase
    "N803",  # Argument name should be lowercase
    "N806",  # Variable in function should be lowercase
    "N999",  # Invalid module name
    "UP035",  # Checks for uses of deprecated imports based on the minimum supported Python version.
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments in function definition
    "PLR0915",  # Too many statements in function
    "PLR2004",  # Magic value used in comparison
    "PLC0415",  # Import not at top of file (intentional for CLI lazy imports)
    "PLW2901",  # For loop variable overwritten by assignment target
    "A002",  # Argument shadows builtin (intentional for `format` parameter)
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
